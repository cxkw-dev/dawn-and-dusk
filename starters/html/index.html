<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My first dawn & dusk page</title>
  <script src="./dd/theme.js"></script>
  <link rel="stylesheet" href="./dd/styles.css">
  <script src="./dd/auto.js" defer></script>
</head>
<body>
  <main class="dd-stack" style="max-width: 38rem; margin: var(--dd-space-12) auto; padding: var(--dd-space-5); gap: var(--dd-space-6)">
    <span class="dd-logo">dawn &amp; dusk</span>
    <h1 class="dd-h1">make something good</h1>
    <p class="dd-lead">Your first page, ready to edit. Both themes are included.</p>
    <div class="dd-card"><div class="dd-card__body">
      <div class="dd-field">
        <label class="dd-field__label" for="project">Project name</label>
        <div class="dd-input"><input class="dd-input__control" id="project" placeholder="My project"></div>
      </div>
      <div class="dd-row">
        <button class="dd-btn dd-btn--primary" type="button" data-dd-toast="You're ready to build">
          <svg class="dd-icon" aria-hidden="true"><use href="#dd-i-plus"></use></svg>Create project
        </button>
        <button class="dd-btn dd-btn--ghost" type="button" data-dd-theme-toggle>Switch theme</button>
      </div>
    </div></div>
    <a class="dd-link" href="https://cxkw-dev.github.io/dawn-and-dusk/components/button/">Browse the components</a>
  </main>
</body>
</html>
